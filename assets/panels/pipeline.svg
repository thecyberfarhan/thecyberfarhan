<svg xmlns="http://www.w3.org/2000/svg" width="880" height="250" viewBox="0 0 880 250" role="img" aria-label="Testing methodology: recon, enumeration, exploitation, post-exploitation, reporting"><title>Testing methodology: recon, enumeration, exploitation, post-exploitation, reporting</title><defs><linearGradient id="g" x2="0" y2="100%"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".12" stop-color="#aaa" stop-opacity=".1"/><stop offset=".88" stop-color="#000" stop-opacity=".25"/><stop offset="1" stop-color="#000" stop-opacity=".45"/></linearGradient><linearGradient id="ug" x1="0" x2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset=".5" stop-color="#A78BFA"/><stop offset="1" stop-color="#F43F5E"/></linearGradient></defs><rect x=".5" y=".5" width="879" height="249" rx="14" fill="#0d1117" stroke="#30363d"/><text x="40" y="46" font-family="'Fira Code','JetBrains Mono','SF Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="20" font-weight="700" fill="#e6edf3" letter-spacing="1">HOW I TEST</text><rect x="40" y="56" width="56" height="3" rx="1.5" fill="url(#ug)"/><path d="M100 140 L780 140" stroke="#30363d" stroke-width="3" fill="none"/><path d="M100 140 L780 140" stroke="url(#ug)" stroke-width="3" fill="none" stroke-dasharray="8 8"><animate attributeName="stroke-dashoffset" values="0;-32" dur="1.2s" repeatCount="indefinite"/></path><circle cx="100" cy="140" r="30" fill="none" stroke="#22D3EE" stroke-width="2"><animate attributeName="r" values="30;44" dur="6s" begin="0.0s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;0" dur="6s" begin="0.0s" repeatCount="indefinite"/></circle><rect x="72" y="112" width="56" height="56" rx="14" fill="#22D3EE"/><rect x="72" y="112" width="56" height="56" rx="14" fill="url(#g)"/><image x="84.32" y="124.32" width="31.36" height="31.36" href="data:image/svg+xml;base64,"/><text x="100" y="198" text-anchor="middle" font-family="'Fira Code','JetBrains Mono','SF Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="13" fill="#e6edf3" font-weight="700">Recon</text><text x="100" y="216" text-anchor="middle" font-family="'Fira Code','JetBrains Mono','SF Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#8b949e">Map the surface</text><circle cx="270" cy="140" r="30" fill="none" stroke="#A78BFA" stroke-width="2"><animate attributeName="r" values="30;44" dur="6s" begin="1.2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;0" dur="6s" begin="1.2s" repeatCount="indefinite"/></circle><rect x="242" y="112" width="56" height="56" rx="14" fill="#A78BFA"/><rect x="242" y="112" width="56" height="56" rx="14" fill="url(#g)"/><image x="254.32" y="124.32" width="31.36" height="31.36" href="data:image/svg+xml;base64,"/><text x="270" y="198" text-anchor="middle" font-family="'Fira Code','JetBrains Mono','SF Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="13" fill="#e6edf3" font-weight="700">Enumeration</text><text x="270" y="216" text-anchor="middle" font-family="'Fira Code','JetBrains Mono','SF Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#8b949e">Find what is exposed</text><circle cx="440" cy="140" r="30" fill="none" stroke="#F43F5E" stroke-width="2"><animate attributeName="r" values="30;44" dur="6s" begin="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;0" dur="6s" begin="2.4s" repeatCount="indefinite"/></circle><rect x="412" y="112" width="56" height="56" rx="14" fill="#F43F5E"/><rect x="412" y="112" width="56" height="56" rx="14" fill="url(#g)"/><image x="424.32" y="124.32" width="31.36" height="31.36" href="data:image/svg+xml;base64,"/><text x="440" y="198" text-anchor="middle" font-family="'Fira Code','JetBrains Mono','SF Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="13" fill="#e6edf3" font-weight="700">Exploitation</text><text x="440" y="216" text-anchor="middle" font-family="'Fira Code','JetBrains Mono','SF Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#8b949e">Prove the impact</text><circle cx="610" cy="140" r="30" fill="none" stroke="#FBBF24" stroke-width="2"><animate attributeName="r" values="30;44" dur="6s" begin="3.5999999999999996s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;0" dur="6s" begin="3.5999999999999996s" repeatCount="indefinite"/></circle><rect x="582" y="112" width="56" height="56" rx="14" fill="#FBBF24"/><rect x="582" y="112" width="56" height="56" rx="14" fill="url(#g)"/><image x="594.32" y="124.32" width="31.36" height="31.36" href="data:image/svg+xml;base64,"/><text x="610" y="198" text-anchor="middle" font-family="'Fira Code','JetBrains Mono','SF Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="13" fill="#e6edf3" font-weight="700">Post-exploit</text><text x="610" y="216" text-anchor="middle" font-family="'Fira Code','JetBrains Mono','SF Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#8b949e">Escalate and pivot</text><circle cx="780" cy="140" r="30" fill="none" stroke="#F472B6" stroke-width="2"><animate attributeName="r" values="30;44" dur="6s" begin="4.8s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;0" dur="6s" begin="4.8s" repeatCount="indefinite"/></circle><rect x="752" y="112" width="56" height="56" rx="14" fill="#F472B6"/><rect x="752" y="112" width="56" height="56" rx="14" fill="url(#g)"/><image x="764.32" y="124.32" width="31.36" height="31.36" href="data:image/svg+xml;base64,"/><text x="780" y="198" text-anchor="middle" font-family="'Fira Code','JetBrains Mono','SF Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="13" fill="#e6edf3" font-weight="700">Reporting</text><text x="780" y="216" text-anchor="middle" font-family="'Fira Code','JetBrains Mono','SF Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#8b949e">Explain and fix</text><circle r="6" fill="#fff"><animateMotion dur="6s" repeatCount="indefinite" path="M100 140 L780 140"/></circle></svg>